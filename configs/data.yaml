  samples_dir: "data/samples"

subsets:
  subset_a:
    name: "prediction_and_profiling"
    target_vms: 3000
    observation_window_minutes: 5
    trace_duration_hours: 24
    time_step_seconds: 300   # 5-minute aggregation window
  subset_b:
    name: "scheduling_simulation"
    target_vms: 7644         # Aligns with Alelyani et al. (2026) scale
    target_pms: 798          # Aligns with Alelyani et al. (2026) scale
    simulation_duration_hours: 24

